name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    name: Rust checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # --all-targets so tests/benches lint too (lib-only missed 8 warnings).
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from the root package.json "packageManager" field

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # pnpm 10+ gates dependency build scripts; allow them so electron/esbuild/
        # workerd postinstalls run (a clean CI install otherwise errors ERR_PNPM_IGNORED_BUILDS).
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: TypeScript check
        run: pnpm typecheck

      - name: Unit tests (renderer)
        # Root vitest is scoped to src/ (see vite.config.ts). Desktop tests run
        # in the dedicated "desktop" job below — they need a WASM build + an
        # Electron stub and would otherwise fail in this plain-Node job.
        run: pnpm test:run

  desktop:
    name: Desktop checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build WASM core
        # engine.test.ts loads ../core/pkg directly; tests in node, electron stubbed.
        run: pnpm --filter csa-desktop build:wasm

      - name: TypeScript check (desktop)
        run: pnpm --filter csa-desktop typecheck

      - name: Unit tests (desktop)
        run: pnpm --filter csa-desktop test

      # E2E app-launch smoke: the unit suite stubs Electron, so it never proves the
      # real app boots. This launches the BUILT Electron app headless (xvfb) with
      # CSA_SMOKE=1 and asserts boot + WASM core + DB migration + a renderer→main→
      # core IPC roundtrip. libnss3/libgbm1 keep their names across the t64 transition;
      # other GUI libs ship on ubuntu-latest. WASM is already built in the step above.
      - name: Electron headless deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1

      - name: E2E app-launch smoke (desktop)
        run: xvfb-run -a pnpm --filter csa-desktop test:e2e

  worker:
    name: Cloudflare Worker checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: TypeScript check (worker)
        run: pnpm --filter champ-select-riot-proxy typecheck

      - name: Unit tests (worker)
        run: pnpm --filter champ-select-riot-proxy test
