name: Release (Public)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build Windows installer (public)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-pub-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pub-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      # NOTE: Authenticode signing is not yet wired — no code-signing certificate.
      # When a cert is available, add `win.certificateFile`/`cscLink` to
      # electron-builder.yml and a decode step gated on an env-derived output
      # (NOT `if: secrets.X != ''`, which GitHub does not evaluate for secrets).
      - name: Build & publish Windows installer (GA release)
        working-directory: desktop
        run: pnpm build:wasm && pnpm exec electron-vite build && pnpm exec electron-builder --publish always --config.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
