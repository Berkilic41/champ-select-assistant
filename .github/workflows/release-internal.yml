name: Release (Internal)

on:
  push:
    tags:
      # Prerelease channels. The trailing * catches dotted suffixes like
      # v0.10.0-beta.4 / -beta.5 (a bare 'v*.*.*-beta' does NOT match those).
      - 'v*.*.*-internal*'
      - 'v*.*.*-beta*'
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build Windows installer (unsigned prerelease)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      # Builds the WASM core (predist hook), the Electron bundle, then the NSIS
      # installer, and publishes Setup.exe + blockmap + latest.yml to the tag's
      # GitHub prerelease (releaseType set in electron-builder.yml).
      - name: Build & publish Windows installer
        working-directory: desktop
        run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
