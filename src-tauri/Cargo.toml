[package]
name = "champ-select-assistant"
version = "0.9.0-beta.1"
description = "League of Legends champion select advisor"
authors = ["Aslan Berkilic"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "champ_select_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
dotenvy = "0.15"
dirs     = "5"
governor = "0.6"
urlencoding = "2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
# CancellationToken lives in tokio_util::sync but is gated behind no separate
# cargo feature — it compiles with default features (no "sync" feature exists).
tokio-util = "0.7"
rustls = "0.23"
ts-rs = "12"

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
